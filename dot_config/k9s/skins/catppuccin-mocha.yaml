# Catppuccin Mocha — matches the Ghostty and yazi themes
foreground: &foreground "#cdd6f4"
background: &background "#1e1e2e"
current_line: &current_line "#313244"
selection: &selection "#45475a"
comment: &comment "#6c7086"
cyan: &cyan "#89dceb"
green: &green "#a6e3a1"
orange: &orange "#fab387"
magenta: &magenta "#cba6f7"
blue: &blue "#89b4fa"
red: &red "#f38ba8"
yellow: &yellow "#f9e2af"

k9s:
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *magenta
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  info:
    fgColor: *magenta
    sectionColor: *foreground
  dialog:
    fgColor: *foreground
    bgColor: *background
    buttonFgColor: *foreground
    buttonBgColor: *magenta
    buttonFocusFgColor: *yellow
    buttonFocusBgColor: *blue
    labelFgColor: *orange
    fieldFgColor: *foreground
  frame:
    border:
      fgColor: *selection
      focusColor: *current_line
    menu:
      fgColor: *foreground
      keyColor: *magenta
      numKeyColor: *magenta
    crumbs:
      fgColor: *foreground
      bgColor: *current_line
      activeColor: *current_line
    status:
      newColor: *cyan
      modifyColor: *magenta
      addColor: *green
      errorColor: *red
      highlightColor: *orange
      killColor: *comment
      completedColor: *comment
    title:
      fgColor: *foreground
      bgColor: *current_line
      highlightColor: *orange
      counterColor: *magenta
      filterColor: *magenta
  views:
    table:
      fgColor: *foreground
      bgColor: *background
      header:
        fgColor: *foreground
        bgColor: *background
        sorterColor: *cyan
    yaml:
      keyColor: *magenta
      colonColor: *blue
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: *background
      indicator:
        fgColor: *magenta
        bgColor: *background
