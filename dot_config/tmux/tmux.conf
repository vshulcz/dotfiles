# prefix stays ctrl+b (ctrl+a would eat beginning-of-line in zsh)

set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# true color under ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,*256col*:Tc"

# splits keep current dir; | and - are easier than % and "
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style pane nav and copy mode
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
# pbcopy on macOS, wayland/x11 clipboard elsewhere
if-shell "command -v pbcopy >/dev/null" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard'"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
