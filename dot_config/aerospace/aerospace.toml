config-version = 2

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-orientation = 'horizontal'

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# ──────────────────────────────────────────
# APP → WORKSPACE RULES
# ──────────────────────────────────────────

# 1 — Terminals
[[on-window-detected]]
if.app-name-regex-substring = 'iTerm2|Terminal|Ghostty'
run = 'move-node-to-workspace --focus-follows-window 1'

# 2 — IDE / notes
[[on-window-detected]]
if.app-name-regex-substring = 'Zed|Code|Cursor|opencode|Obsidian'
run = 'move-node-to-workspace --focus-follows-window 2'

# 3 — Browsers
[[on-window-detected]]
if.app-name-regex-substring = 'Firefox|Chrome|Safari|YandexBrowser'
run = 'move-node-to-workspace --focus-follows-window 3'

# 4 — Communication
[[on-window-detected]]
if.app-name-regex-substring = 'Telegram|Discord|Mail|Jazz'
run = 'move-node-to-workspace --focus-follows-window 4'

[[on-window-detected]]
if.app-name-regex-substring = 'TickTick'
if.window-title-regex-substring = 'TickTick'
run = 'move-node-to-workspace --focus-follows-window 4'

# 5 — Music
[[on-window-detected]]
if.app-name-regex-substring = 'Spotify|Yandex'
run = 'move-node-to-workspace --focus-follows-window 5'

# Floating — popups and tools
[[on-window-detected]]
if.app-name-regex-substring = 'TickTick'
if.window-title-regex-substring = 'Window'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Hiddify|OBS'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Pages|Numbers|Keynote'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Finder|System Preferences|System Settings|Activity Monitor|Calculator|Disk Utility'
run = 'layout floating'

# ──────────────────────────────────────────
# KEYBINDINGS
# ──────────────────────────────────────────
[mode.main.binding]

# Focus — hjkl and arrows
alt-h     = 'focus left'
alt-j     = 'focus down'
alt-k     = 'focus up'
alt-l     = 'focus right'
alt-left  = 'focus left'
alt-down  = 'focus down'
alt-up    = 'focus up'
alt-right = 'focus right'

# Move window in tiling layout — hjkl
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Join-with — вложить в соседний контейнер (для создания сеток)
alt-shift-left  = 'join-with left'
alt-shift-down  = 'join-with down'
alt-shift-up    = 'join-with up'
alt-shift-right = 'join-with right'


# Float / fullscreen
alt-f       = 'layout floating tiling'
alt-shift-f = 'fullscreen'

# Switch workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Monitors
alt-tab       = 'focus-monitor --wrap-around next'
alt-shift-tab = 'move-node-to-monitor --wrap-around next'

# Utility
alt-shift-r = 'reload-config'
alt-shift-q = 'close'
